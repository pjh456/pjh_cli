name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format 19.1.7
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.hpp' '*.cpp' \
            | xargs -0 clang-format --dry-run --Werror --style=file

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 14
            os: ubuntu-24.04
            ccache_variant: ccache
            cmake_args: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
            install: |
              sudo apt-get update
              sudo apt-get install -y g++-14

          - name: Linux Clang 19
            os: ubuntu-24.04
            ccache_variant: ccache
            cmake_args: -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
            install: |
              sudo apt-get update && sudo apt-get install -y wget gpg
              wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
              sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
              sudo apt-get update && sudo apt-get install -y clang-19

          - name: Windows MSVC
            os: windows-2022
            ccache_variant: ccache
            cmake_args: -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Layering guard
        run: cmake -DPJH_CLI_SOURCE_DIR="${{ github.workspace }}" -P cmake/check_layering.cmake

      - name: Header hygiene guard
        run: cmake -DPJH_CLI_SOURCE_DIR="${{ github.workspace }}" -P cmake/check_header_hygiene.cmake

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.ccache_variant }}

      - name: Install dependencies
        if: matrix.install
        run: ${{ matrix.install }}

      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.name == 'Windows MSVC'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
        run: cmake -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify installed package exports pjh::cli
        if: matrix.name == 'Linux GCC 14'
        run: |
          prefix="${RUNNER_TEMP}/pjh-cli-prefix"

          # pjh_cliConfig references pjh_platform; pjh_result installs
          # unconditionally (no top-level gate), pjh_platform does not.
          cmake --install build --prefix "${prefix}"

          # Build+install pjh_platform as its own top-level project so its
          # pjh_platformConfig.cmake is generated (as a FetchContent subproject
          # pjh_platform's install(EXPORT) gate is false and nothing is installed).
          platform_src="${GITHUB_WORKSPACE}/build/_deps/pjh_platform-src"
          if [ ! -d "${platform_src}" ]; then
            platform_src="${RUNNER_TEMP}/pjh-platform-src"
            git clone --depth 1 --branch v0.2.0 \
              https://github.com/pjh456/pjh_platform.git "${platform_src}"
          fi
          cmake -S "${platform_src}" -B "${RUNNER_TEMP}/pjh-platform" \
            -DPJH_PLATFORM_BUILD_TESTS=OFF \
            -DPJH_PLATFORM_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="${prefix}"
          cmake --build "${RUNNER_TEMP}/pjh-platform" --parallel
          cmake --install "${RUNNER_TEMP}/pjh-platform" --prefix "${prefix}"

          cmake -S tests/consumer -B "${RUNNER_TEMP}/pjh-cli-consumer" \
            -DCMAKE_PREFIX_PATH="${prefix}"
          cmake --build "${RUNNER_TEMP}/pjh-cli-consumer" --parallel
          "${RUNNER_TEMP}/pjh-cli-consumer/consumer"
